<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DivtoVid launch reel</title>
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:"Inter";font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:"Inter";font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:"Inter";font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
:root{--bg:#EDEDE8;--bg2:#F4F4F0;--ink:#1C1C1A;--mut:#6B6B66;--green:#2E5E45;--card:#FAFAF7;--line:#E4E4DE;
  --mint:#D7E8DC;--peach:#F0DCD3;--cream:#EFE4C8;--blush:#F2D9D4;--grey:#ECECE7;--red:#B8443A;--redbg:#F3DAD6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 38%,var(--bg2),var(--bg) 70%);font-family:Inter,sans-serif;color:var(--ink)}
#grain{position:absolute;inset:-60px;pointer-events:none;opacity:.05;mix-blend-mode:multiply;z-index:50;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.scene{position:absolute;inset:0;display:none}
.eyebrow{position:absolute;left:90px;right:90px;top:160px;font:500 24px "JetBrains Mono",monospace;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
.h1{position:absolute;left:90px;right:90px;top:204px;font:400 66px/1 "Instrument Serif",serif;color:var(--ink)}
.h2{position:absolute;left:90px;right:90px;top:268px;font:400 124px/1.02 "Instrument Serif",serif;color:var(--ink);letter-spacing:-.01em}
.h2 i,.h1 i{color:var(--green);font-style:italic}
.card{position:absolute;left:90px;width:900px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
.mono{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}
.pill{position:absolute;padding:10px 22px;border-radius:999px;font:500 20px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.pill.g{background:var(--green);color:#fff}
.pill.o{border:1.5px solid var(--green);color:var(--green)}
.tile{position:absolute;border-radius:16px}
.circle{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid #D4D4CC;display:grid;place-items:center;font:600 30px Inter;color:#fff;background:transparent}
.caret{display:inline-block;width:3px;height:1em;background:var(--green);vertical-align:-.12em;margin-left:3px}
</style>
</head>
<body>
<div id="stage"><div id="grain"></div></div>
<script>
const W=1080,H=1920,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const bez=(x1,y1,x2,y2)=>x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const cx=3*x1*t*(1-t)**2+3*x2*t*t*(1-t)+t**3-x;const d=3*x1*(1-t)**2+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(d)<1e-6)break;t-=cx/d}return 3*y1*t*(1-t)**2+3*y2*t*t*(1-t)+t**3};
const ease=bez(.22,1,.36,1);
const back=x=>{const s=1.70158,u=x-1;return 1+(s+1)*u*u*u+s*u*u};
const lerp=(a,b,p)=>a+(b-a)*p;
const stage=document.getElementById('stage');
const CUES=[];            // [absolute seconds, kind]
const scenes=[];

function h(tag,cls,html,css){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)e.style.cssText=css;return e}
function add(p,e){p.appendChild(e);return e}
function rise(e,lt,at,dur=.45){const p=ease(clamp((lt-at)/dur));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*24}px)`}
function pop(e,lt,at,dur=.4){const p=clamp((lt-at)/dur);e.style.opacity=clamp(p*3);e.style.transform=`scale(${.85+.15*back(p)})`}
function show(e,lt,at){e.style.opacity=lt>=at?1:0}
function typeText(e,txt,lt,at,cps=24,caretEl){const n=Math.floor(Math.max(0,lt-at)*cps);e.textContent=txt.slice(0,Math.min(n,txt.length));if(caretEl){const typing=lt>=at&&n<=txt.length;caretEl.style.opacity=lt<at?0:(typing&&n<txt.length?1:(Math.floor(lt*2.4)%2?0:1))}}
function count(e,from,to,lt,at,dur,suffix=''){const p=ease(clamp((lt-at)/dur));e.textContent=Math.round(lerp(from,to,p))+suffix}
function check(c,lt,at,ok=true){const p=clamp((lt-at)/.35);c.style.transform=`scale(${.85+.15*back(p)})`;c.style.background=p>0?(ok?'#2E5E45':'#B8443A'):'transparent';c.style.borderColor=p>0?(ok?'#2E5E45':'#B8443A'):'#D4D4CC';c.textContent=p>0?(ok?'✓':'×'):''}

function makeScene(id,start,end,eyebrow,l1,l2){
  const el=add(stage,h('div','scene'));el.id=id;
  const eb=add(el,h('div','eyebrow',eyebrow)),a=add(el,h('div','h1',l1)),b=add(el,h('div','h2',l2));
  const s={id,start,end,el,ups:[],head(lt){rise(eb,lt,.0,.4);rise(a,lt,.1,.45);rise(b,lt,.22,.5)},cue(at,k){CUES.push([start+at,k])}};
  scenes.push(s);return s;
}

/* ---------- 1. Hook ---------- */
{
  const s=makeScene('s1',0,3.2,'DivtoVid · for every website','Website hai?','Video <i>chahiye?</i>');
  const wf=add(s.el,h('div','card','',`top:470px;height:470px`));
  const dots=['#E8685A','#E9B44C','#4CAF8A'].map((c,i)=>add(wf,h('div','tile','',`left:${30+i*34}px;top:28px;width:20px;height:20px;border-radius:50%;background:${c}`)));
  const bar=add(wf,h('div','tile','',`left:30px;top:80px;width:400px;height:30px;background:var(--grey)`));
  const hero=add(wf,h('div','tile','',`left:30px;top:130px;width:840px;height:150px;background:var(--mint)`));
  const mini=[['var(--peach)',30],['var(--cream)',310],['var(--blush)',590]].map(([c,x])=>add(wf,h('div','tile','',`left:${x}px;top:305px;width:270px;height:130px;background:${c}`)));
  const arrowLine=add(s.el,h('div','','',`position:absolute;left:538px;top:960px;width:4px;height:0;background:var(--green);border-radius:2px`));
  const arrowHead=add(s.el,h('div','','',`position:absolute;left:521px;top:1034px;width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:28px solid var(--green)`));
  const pv=add(s.el,h('div','card','',`top:1090px;height:520px;background:var(--ink);border-color:var(--ink)`));
  const pb=add(pv,h('div','','▶',`position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-95px 0 0 -75px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:58px;padding-left:8px`));
  const pm=add(pv,h('div','mono','promo.mp4 · 0:30',`position:absolute;left:36px;bottom:34px;font-size:20px;color:#9A9A92`));
  const track=add(pv,h('div','','',`position:absolute;left:36px;right:36px;bottom:80px;height:6px;border-radius:3px;background:#3A3A36`));
  const fill=add(track,h('div','','',`height:100%;width:0;border-radius:3px;background:var(--green)`));
  s.cue(.2,'whoosh');s.cue(1.0,'pop');s.cue(1.2,'pop');s.cue(1.4,'pop');s.cue(1.9,'click');s.cue(2.2,'pop');
  s.update=lt=>{s.head(lt);
    rise(wf,lt,.45,.5);
    [bar,hero,...mini].forEach((e,i)=>pop(e,lt,.8+i*.12));
    arrowLine.style.opacity=lt>1.8?1:0;arrowLine.style.height=ease(clamp((lt-1.8)/.4))*74+'px';
    show(arrowHead,lt,2.1);
    pop(pv,lt,2.2,.45);fill.style.width=ease(clamp((lt-2.5)/.7))*70+'%';
  };
}

/* ---------- 2. One command ---------- */
{
  const s=makeScene('s2',3.2,8.6,'One command','Ek command.','<i>Bas.</i>');
  const cc=add(s.el,h('div','card','',`top:470px;height:230px`));
  add(cc,h('div','mono','Claude Code',`position:absolute;left:36px;top:30px;font-size:18px`));
  const line=add(cc,h('div','','',`position:absolute;left:36px;top:100px;font:500 34px "JetBrains Mono",monospace;color:var(--ink);white-space:nowrap`));
  const txt=add(line,h('span','',''));const caret=add(line,h('span','caret'));
  const lab=add(s.el,h('div','mono','Kitne second ka video?',`position:absolute;left:90px;top:770px;font-size:22px`));
  const chips=['15 sec','30 sec','60 sec'].map((t,i)=>add(s.el,h('div','','',`position:absolute;left:${90+i*300}px;top:830px;width:280px;height:110px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font:500 36px Inter`)));
  chips.forEach((c,i)=>c.textContent=['15 sec','30 sec','60 sec'][i]);
  const enter=add(s.el,h('div','pill g','Enter ↵',`left:90px;top:1000px;font-size:24px;padding:16px 34px`));
  s.cue(.7,'type');s.cue(2.0,'pop');s.cue(2.1,'pop');s.cue(2.2,'pop');s.cue(3.4,'click');s.cue(4.1,'pop');s.cue(.0,'whoosh');
  s.update=lt=>{s.head(lt);
    rise(cc,lt,.4,.5);typeText(txt,'/divtovid https://yoursite.com',lt,.9,24,caret);
    rise(lab,lt,2.3,.4);chips.forEach((c,i)=>pop(c,lt,2.0+i*.12));
    const hl=ease(clamp((lt-3.4)/.3));const c=chips[1];
    c.style.background=hl>0?`rgb(${lerp(250,46,hl)},${lerp(250,94,hl)},${lerp(247,69,hl)})`:'var(--card)';c.style.color=hl>.5?'#fff':'var(--ink)';c.style.borderColor=hl>0?'var(--green)':'var(--line)';
    if(lt>3.4)c.style.transform=`scale(${1+.04*Math.sin(clamp((lt-3.4)/.4)*Math.PI)})`;
    pop(enter,lt,4.1);
  };
}

/* ---------- 3. Claude does everything ---------- */
{
  const s=makeScene('s3',8.6,15.6,'Claude karega','Claude','sab <i>karega</i>');
  const rows=[
    ['01','Scrape','Site <i>padhega</i>','Name · tagline · colours'],
    ['02','Script','Script <i>likhega</i>','4-6 scenes · 30 fps'],
    ['03','Animate','Scenes <i>animate karega</i>','Brand colours · fonts'],
    ['04','Send','Video <i>bhejega</i>','Seedha chat mein']
  ].map(([n,tag,t,meta],i)=>{
    const c=add(s.el,h('div','card','',`top:${470+i*226}px;height:200px`));
    add(c,h('div','tile','',`left:30px;top:30px;width:140px;height:140px;background:${['var(--mint)','var(--peach)','var(--cream)','var(--blush)'][i]}`));
    add(c,h('div','','',`position:absolute;left:30px;top:30px;width:140px;height:140px;display:grid;place-items:center;font:400 72px "Instrument Serif"`)).textContent=n;
    add(c,h('div','mono','Agent '+n+' · '+tag,`position:absolute;left:200px;top:34px;font-size:18px`));
    const tt=add(c,h('div','',t,`position:absolute;left:200px;top:68px;font:400 54px/1.1 "Instrument Serif"`));tt.querySelectorAll('i').forEach(x=>x.style.cssText='color:#2E5E45;font-style:italic');
    add(c,h('div','mono',meta,`position:absolute;left:200px;top:142px;font-size:17px`));
    const ci=add(c,h('div','circle','',`right:34px;top:72px`));
    const bar=add(c,h('div','','',`position:absolute;left:200px;right:130px;bottom:22px;height:6px;border-radius:3px;background:var(--grey)`));
    const f=add(bar,h('div','','',`height:100%;width:0;border-radius:3px;background:var(--green)`));
    return {c,ci,f,at:.7+i*1.45};
  });
  rows.forEach(r=>{s.cue(r.at,'pop');s.cue(r.at+.95,'click')});s.cue(0,'whoosh');
  s.update=lt=>{s.head(lt);
    rows.forEach(r=>{rise(r.c,lt,r.at,.5);r.f.style.width=ease(clamp((lt-r.at-.2)/.75))*100+'%';check(r.ci,lt,r.at+.95)});
  };
}

/* ---------- 4. Video ready ---------- */
{
  const s=makeScene('s4',15.6,20.4,'Render','Aur phir','video <i>ready.</i>');
  const fc=add(s.el,h('div','card','',`top:470px;height:280px`));
  const ic=add(fc,h('div','tile','▶',`left:34px;top:34px;width:110px;height:110px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;padding-left:5px`));
  add(fc,h('div','','promo.mp4',`position:absolute;left:176px;top:36px;font:500 36px Inter`));
  add(fc,h('div','mono','0:30 · MP4 · 1920x1080',`position:absolute;left:176px;top:90px;font-size:17px`));
  const pc=add(fc,h('div','','0%',`position:absolute;right:36px;top:46px;font:500 40px "JetBrains Mono"`));
  const track=add(fc,h('div','','',`position:absolute;left:34px;right:34px;top:176px;height:14px;border-radius:7px;background:var(--grey)`));
  const f=add(track,h('div','','',`height:100%;width:0;border-radius:7px;background:var(--green)`));
  const p1=add(s.el,h('div','pill g','Sent in chat',`left:90px;top:800px;font-size:22px`));
  const p2=add(s.el,h('div','pill o','Ready',`left:370px;top:800px;font-size:22px`));
  add(s.el,h('div','mono','4-6 scenes, har ek ek idea',`position:absolute;left:90px;top:930px;font-size:20px;opacity:0`)).id='s4lab';
  const lab=s.el.querySelector('#s4lab');
  const strip=['var(--mint)','var(--peach)','var(--cream)','var(--blush)','var(--grey)'].map((c,i)=>{
    const t=add(s.el,h('div','','',`position:absolute;left:${90+i*184}px;top:990px;width:172px;height:300px;border-radius:18px;background:${c};border:1px solid var(--line)`));
    add(t,h('div','mono','Scene 0'+(i+1),`position:absolute;left:16px;top:16px;font-size:14px`));
    add(t,h('div','','',`position:absolute;left:16px;right:16px;bottom:18px;height:10px;border-radius:5px;background:rgba(28,28,26,.12)`));
    return t;
  });
  s.cue(0,'whoosh');s.cue(.4,'pop');s.cue(.9,'type');s.cue(2.6,'click');s.cue(2.8,'pop');s.cue(3.0,'pop');[0,1,2,3,4].forEach(i=>s.cue(3.2+i*.12,'pop'));
  s.update=lt=>{s.head(lt);
    rise(fc,lt,.4,.5);const p=ease(clamp((lt-.9)/1.6));f.style.width=p*100+'%';count(pc,0,100,lt,.9,1.6,'%');
    pop(p1,lt,2.6);pop(p2,lt,2.9);rise(lab,lt,3.0,.4);strip.forEach((t,i)=>pop(t,lt,3.2+i*.12));
  };
}

/* ---------- 5. Real content ---------- */
{
  const s=makeScene('s5',20.4,24.8,'Real content','Fake content?','<i>Zero.</i>');
  const card=add(s.el,h('div','card','',`top:470px;height:640px`));
  const items=[
    ['T','Sirf site ka real text','var(--mint)',true],
    ['●','Brand colours aur fonts','var(--peach)',true],
    ['&lt;/&gt;','Open source, MIT','var(--cream)',true],
    ['!','Invented claims','var(--redbg)',false]
  ].map(([g,label,col,ok],i)=>{
    const r=add(card,h('div','','',`position:absolute;left:24px;right:24px;top:${28+i*148}px;height:124px;border-radius:16px`));
    add(r,h('div','tile','',`left:14px;top:14px;width:96px;height:96px;background:${col}`));
    add(r,h('div','',g,`position:absolute;left:14px;top:14px;width:96px;height:96px;display:grid;place-items:center;font:500 ${g.length>3?34:44}px "JetBrains Mono";color:${ok?'#1C1C1A':'#B8443A'}`));
    add(r,h('div','',label,`position:absolute;left:140px;top:38px;font:500 36px Inter`));
    const ci=add(r,h('div','circle','',`right:20px;top:34px`));
    return {r,ci,ok,at:.9+i*.8};
  });
  items.forEach(it=>{s.cue(it.at,it.ok?'click':'pop')});s.cue(0,'whoosh');
  s.update=lt=>{s.head(lt);
    rise(card,lt,.4,.5);
    items.forEach(it=>{rise(it.r,lt,it.at-.2,.4);check(it.ci,lt,it.at,it.ok);if(!it.ok)it.r.style.background=lt>=it.at?'#F3DAD6':'transparent'});
  };
}

/* ---------- 6. CTA ---------- */
{
  const s=makeScene('s6',24.8,29.6,'Try karo','Comment mein likho','“<i>divtovid</i>”');
  const box=add(s.el,h('div','card','',`top:620px;height:150px;border-radius:999px`));
  add(box,h('div','tile','',`left:24px;top:27px;width:96px;height:96px;border-radius:50%;background:var(--mint)`));
  const line=add(box,h('div','','',`position:absolute;left:150px;top:44px;font:500 42px Inter;white-space:nowrap`));
  const txt=add(line,h('span','',''));const caret=add(line,h('span','caret'));
  const send=add(box,h('div','','↑',`position:absolute;right:24px;top:27px;width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:500 46px Inter`));
  const sent=add(s.el,h('div','pill g','Link bio mein',`left:90px;top:820px;font-size:22px`));
  const logo=add(s.el,h('img','','',`position:absolute;left:340px;top:960px;width:400px;height:400px;border-radius:84px;box-shadow:0 20px 60px rgba(46,94,69,.25)`));logo.src='../website/logo.png';
  const foot=add(s.el,h('div','mono','Made by codesingers.in',`position:absolute;left:0;right:0;top:1560px;text-align:center;font-size:24px`));
  s.cue(0,'whoosh');s.cue(.6,'pop');s.cue(1.2,'type');s.cue(2.4,'click');s.cue(2.6,'pop');s.cue(2.9,'pop');
  s.update=lt=>{s.head(lt);
    rise(box,lt,.4,.5);typeText(txt,'divtovid',lt,1.2,8,caret);
    const k=clamp((lt-2.4)/.3);send.style.transform=`scale(${1+.12*Math.sin(k*Math.PI)})`;
    pop(sent,lt,2.7);pop(logo,lt,2.9,.5);rise(foot,lt,3.5,.5);
  };
}

const TOTAL=scenes[scenes.length-1].end;
function setTime(t){
  const sc=scenes.find(x=>t>=x.start&&t<x.end)||scenes[scenes.length-1];
  scenes.forEach(x=>x.el.style.display=x===sc?'block':'none');
  sc.update(t-sc.start);
  const f=Math.round(t*FPS);document.getElementById('grain').style.transform=`translate(${(f*37)%60}px,${(f*53)%60}px)`;
}
window.setTime=setTime;window.TOTAL=TOTAL;window.CUES=CUES;window.FPS=FPS;
setTime(0);
</script>
</body>
</html>
